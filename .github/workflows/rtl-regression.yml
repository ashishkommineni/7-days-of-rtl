name: RTL regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verilator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: Run seven-day regression
        run: make regression
